# CloudFront serves both the frontend and Convex API on the same HTTPS origin.
# Preserve /api/ in the upstream path: Convex uses it for HTTP and WebSockets.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 650s;
    proxy_send_timeout 650s;

    location /api/ {
        proxy_pass http://backend:3210;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /version {
        proxy_pass http://backend:3210;
    }

    location = /instance_name {
        proxy_pass http://backend:3210;
    }

    location = /instance_version {
        proxy_pass http://backend:3210;
    }

    location = /echo {
        proxy_pass http://backend:3210;
    }

    location = /health {
        access_log off;
        proxy_pass http://backend:3210/version;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ /index.html;
    }
}
